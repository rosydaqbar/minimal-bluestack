[package]
name = "bluestacks-toolbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local GPUI manager for installed Android apps and native BlueStacks game windows"
readme = "README.md"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minimal-core = { path = "crates/core" }

[workspace]
members = ["crates/core", "crates/guard", "crates/bridge", "crates/guest", "xtask"]
default-members = ["."]
resolver = "2"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
debug = 0
strip = "debuginfo"
